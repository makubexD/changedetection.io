# changedetection.io under rootless Podman.
#
# This is an ADDITION to the project's Docker support, not a replacement --
# ../../docker-compose.yml is unchanged and remains the Docker path.
#
#   podman-compose -f contrib/podman/podman-compose.yml up -d
#   podman-compose -f contrib/podman/podman-compose.yml logs -f
#   podman-compose -f contrib/podman/podman-compose.yml down
#
# WITH a real Chrome browser (JS-rendered pages, Browser Steps, Visual Selector).
# Both the profile and the env var are needed -- the profile starts the browser,
# the env var tells the app where it is:
#
#   PowerShell:
#     $env:PLAYWRIGHT_DRIVER_URL = "ws://browser-sockpuppet-chrome:3000"
#     podman-compose -f contrib/podman/podman-compose.yml --profile browser up -d
#
#   bash:
#     PLAYWRIGHT_DRIVER_URL=ws://browser-sockpuppet-chrome:3000 \
#       podman-compose -f contrib/podman/podman-compose.yml --profile browser up -d
#
# Needs podman-compose >= 1.0.4 for --profile. See ./PRICE-TRACKING.md for what
# the browser unlocks, and ./README.md for setup and rootless gotchas.

services:
  changedetection:
    # Build from this repo:  podman-compose -f contrib/podman/podman-compose.yml build
    build:
      context: ../..
      dockerfile: Dockerfile
    # Pulled if you skip the build above. This fork's own image, built and
    # pushed by .github/workflows/maku-container-build.yml on every push to
    # maku-release. GHCR lowercases the namespace, hence makubexd rather than makubexD.
    image: ghcr.io/makubexd/changedetection.io:stable
    # Upstream's image instead:
    # image: ghcr.io/dgtlmoon/changedetection.io:latest
    container_name: changedetection
    hostname: changedetection
    restart: unless-stopped

    volumes:
      # A NAMED volume, deliberately. Under rootless Podman the container's
      # root maps to your unprivileged uid, so a host bind mount at /datastore
      # lands with ids the container cannot write. Named volumes are managed
      # inside the podman machine and sidestep that entirely.
      - changedetection-data:/datastore
      # If you must bind-mount, add :Z so SELinux relabels it (Fedora/RHEL):
      # - ./proxies.json:/datastore/proxies.json:Z

    ports:
      # >1024, so rootless Podman binds it without granting extra capabilities
      # or lowering net.ipv4.ip_unprivileged_port_start.
      - 127.0.0.1:5000:5000

    environment:
      # Used in notification bodies to link back to this instance.
      - BASE_URL=http://localhost:5000
      # Empty unless you set it (see the header). Deliberately NOT hardcoded to
      # the browser hostname: setting it makes the app treat Chrome as available,
      # so hardcoding it would point every watch at a browser that is not running
      # whenever the stack is started without the browser profile.
      - PLAYWRIGHT_DRIVER_URL=${PLAYWRIGHT_DRIVER_URL:-}
      # Optional companion: set this to html_webdriver alongside the driver URL
      # and NEW watches default to Chrome instead of the plain HTTP fetcher.
      # Seeds the settings default only, so it affects a fresh datastore; an
      # existing one keeps its saved value (Settings -> Fetching -> Fetch Method).
      - DEFAULT_FETCH_BACKEND=${DEFAULT_FETCH_BACKEND:-}
      # Disable when the remote CDP implementation does not support
      # Page.setBypassCSP - like with Obscura browser.
      # - PLAYWRIGHT_BYPASS_CSP=false
      # - LOGGER_LEVEL=DEBUG
      # - FETCH_WORKERS=10
      # - PAGE_WATCH_LIMIT=100

    # No depends_on for the browser, deliberately. The app does not talk to it at
    # startup, only when a watch actually fetches, so a hard dependency would buy
    # nothing and would fail the whole stack when the browser profile is off.

  # Chrome wrapped in an API for fast page fetching. Started only with
  # `--profile browser`, so plain `up -d` keeps running a single container.
  browser-sockpuppet-chrome:
    profiles: ["browser"]
    # Pinned by DIGEST, not :latest. That tag is rebuilt often, and the image's
    # Dockerfile installs whatever Chrome Stable is current on build day
    # (ARG CHROME_VERSION=current) -- so :latest silently swaps Chrome under you.
    # Upstream CI broke exactly this way on 2026-09-10.
    # To move to a newer browser, do it deliberately:
    #   podman pull docker.io/dgtlmoon/sockpuppetbrowser:latest
    #   podman image inspect docker.io/dgtlmoon/sockpuppetbrowser:latest --format '{{.Digest}}'
    image: docker.io/dgtlmoon/sockpuppetbrowser@sha256:a61e64a694fef3b6d375a3c7c7dd7d74b1166a48b231cd98870b78f244deef79
    container_name: browser-sockpuppet-chrome
    hostname: browser-sockpuppet-chrome
    restart: unless-stopped

    # Podman defaults /dev/shm to 64MB; Chrome dies with "Target closed" and
    # renderer failures well before that is genuinely exhausted.
    shm_size: 2gb

    cap_add:
      # May be more than strictly needed, but Chrome's sandbox wants it inside a
      # container. https://github.com/puppeteer/puppeteer/blob/main/docs/troubleshooting.md
      - SYS_ADMIN

    # Port 3000 is deliberately NOT published to the host. Only the app needs to
    # reach it, and it does so over the compose network.
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=10

volumes:
  changedetection-data:

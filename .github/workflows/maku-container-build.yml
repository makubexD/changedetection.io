# Builds and publishes this fork's own container image to GHCR.
#
# Upstream's containers.yml publishes to dgtlmoon's namespaces and is
# fork-guarded off; this workflow is the fork's replacement for it.
#
# Image: ghcr.io/makubexd/changedetection.io
#   (GHCR lowercases namespaces, so makubexD -> makubexd)
name: Build and push container (maku)

on:
  push:
    branches:
      - maku-release
    tags:
      - 'maku-v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Do not run if this file ever ends up back upstream.
    if: github.repository == 'makubexD/changedetection.io'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=match,pattern=maku-v(.*),group=1
            # Fixed alias so deploy files never pin a branch-derived tag.
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/maku-release' }}
          # Overrides the Dockerfile's LABELs so the package links to this
          # fork rather than to upstream.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=changedetection.io (makubexD fork)

      # linux/amd64 only: arm64 emulation roughly triples build time here and
      # there is no arm64 deployment target.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pushed images" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
